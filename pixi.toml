# Locked environment for the analysis pipeline (checkpoints -> tables -> figures -> report).
# Training on the cluster still uses the conda env in README.md / slurm/; this env is CPU-only.
[workspace]
name = "canonical_mc"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
pytorch-cpu = ">=2.0"
numpy = ">=1.24"
pandas = ">=2.0"
scipy = ">=1.10"
matplotlib = ">=3.7"
tqdm = ">=4.65"
snakemake-minimal = ">=8"
quarto = ">=1.5"
graphviz = "*"
pytest = ">=8"

[pypi-dependencies]
cmc = { path = ".", editable = true }

[tasks]
test = "pytest -q tests"
dry = "snakemake -n"
pipeline = "snakemake -c4"
dag = "snakemake --rulegraph | dot -Tsvg > reports/dag.svg"
report = "quarto render reports/study.qmd"
